[package]
name = "persistence"
description = "SQLite access, migrations and repositories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
sqlx.workspace = true
futures-core.workspace = true
futures-util.workspace = true
log.workspace = true
tracing.workspace = true
time.workspace = true
uuid.workspace = true

# The domain newtypes (`SessionId`, `ClientMessageId`, `Msisdn`) and the typed
# protocol values (`Ton`, `Npi`, `DataCoding`, `CommandStatus`) live in
# `smpp-core`, the bottom layer. Depending on it is a DOWNWARD edge (guide
# §8.1), and the only alternative would be to store those columns as bare
# `String`/`u8` — exactly what CLAUDE.md §4 forbids.
smpp-core = { path = "../smpp-core" }

# THE UPWARD EDGE, and it is the point rather than an accident.
#
# `messaging` declares `MessageRepository` and this crate implements it — the
# dependency inversion of guide §8.1 and CLAUDE.md §3, whose whole cost is
# exactly this edge. ADR 0007 deferred it while `messaging` was an empty
# shell; ADR 0010 pays it now that the shell has an orchestrator.
#
# `messaging` itself depends on `smpp-core` and on nothing else of ours, so
# the graph stays acyclic.
messaging = { path = "../messaging" }

# THE SECOND UPWARD EDGE, and the same reasoning one milestone later.
#
# `contacts` declares `ContactRepository` and this crate implements it — the
# deadline ADR 0007 set itself for that port, honoured by ADR 0012 and required
# by CA-009-13. `contacts` depends on `smpp-core` and on nothing else of ours,
# so the graph stays acyclic; there is deliberately no dev-dependency in the
# other direction either, which would form a cycle Cargo tolerates and
# CLAUDE.md §3 does not distinguish.
contacts = { path = "../contacts" }

# `tokio::fs` for creating the data directory. Async on purpose: the blocking
# `std::fs` equivalent on a runtime thread is what CLAUDE.md §4 rules out.
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
serde_json.workspace = true
sha2.workspace = true
stats_alloc.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
