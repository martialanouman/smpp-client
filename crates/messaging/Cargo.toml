[package]
name = "messaging"
description = "Encoding, segmentation and send orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

# THE ONLY INTERNAL DEPENDENCY, and that is the milestone-006 change.
#
# This crate used to depend on `smpp-session` and `persistence`. It now
# declares two ports instead — `MessageRepository` and `SmscSession` — which
# those crates implement (ADR 0010). The edges therefore point *at* this
# crate, which is what dependency inversion means (CLAUDE.md §3): the
# orchestrator states its contract, the layers below satisfy it, and a test
# needs neither a socket nor a database file.
#
# It is also what makes the graph acyclic. `smpp-session` depends on
# `persistence` for the session-profile record; had this crate kept its own
# edge to `smpp-session`, moving `MessageRepository` here would have closed
# the loop `messaging -> smpp-session -> persistence -> messaging`.
smpp-core = { path = "../smpp-core" }

# `attributes` for `#[tracing::instrument]`: CLAUDE.md §4 asks for a span per
# `session_id` and per `campaign_id`, and the attribute is the only way to open
# one that covers a whole `async fn` without hand-rolled guards across every
# `.await`.
tracing = { workspace = true, features = ["attributes"] }

# Two uses, and the second is what adds the `v5` feature.
#
# `v4` — the random seed of the concatenation reference counter: a
# deterministic start would hand a restarting session a reference that may
# still be in flight. A v4 UUID is platform entropy, and `uuid` is already in
# the graph — adding a random-number crate for two octets would not pass
# CLAUDE.md §2.
#
# `v5` — milestone 010. The write-ahead key of a campaign message is a **pure
# function** of the campaign and the recipient (`campaign::resume::message_key`),
# which is what makes "at most one emission per recipient" survive a cold
# restart: a resumed campaign re-derives the identifier it used before rather
# than minting a second one for the same person. v5 is name-based and
# deterministic; v3 would be the same thing over MD5, and v8 would mean
# choosing a hash by hand. The feature costs `sha1_smol`, which has no
# dependencies of its own.
uuid = { workspace = true, features = ["v5"] }

# `BoxStream` in the signature of `ports::RecipientSource` (guide §11.3), and
# the `StreamExt::next` the feeder drives one with. The same pair, for the same
# reason, as `contacts::ports::ContactRepository`: reading 500 000 recipients
# without materialising them (CA-010-01) is a stream, and a stream in a port
# signature has to be boxed to stay object-safe across the crate boundary.
futures-core.workspace = true
futures-util.workspace = true

# `CancellationToken`, the one shutdown signal every long-running task of this
# workspace watches (CLAUDE.md §4). CA-010-09 makes it load-bearing here: a
# campaign parked in a retry delay or blocked pushing into a full queue has to
# stop on cancellation, and `rt` is the feature that brings `tokio_util::sync`
# in.
tokio-util = { workspace = true, features = ["rt"] }

# The daily send window of CA-010-10 is a wall-clock question — "is 23:30 in
# Abidjan inside 08:00–20:00?" — and answering it needs date arithmetic on the
# instant `smpp_core::time::Timestamp` already carries. `time` is what that
# type is built on, so this is the same calendar rather than a second one.
time.workspace = true

# Milestone 008. The delivery-receipt pipeline is a task fed by a bounded
# channel that commits a batch of transitions every N receipts or every T
# milliseconds (CA-008-10), so it needs `sync` for the channel and `time` for
# the deadline. Both are needed *here*, not in `src-tauri`: putting the loop at
# the boundary would put the batching policy — the thing CA-008-10 is about —
# in a layer CLAUDE.md §3 says holds no business logic.
#
# No `rt`: this crate spawns nothing. The caller owns the task and drives the
# future, which is what lets the tests run it under `tokio::time::pause()`.
#
# `macros` is for `tokio::select!`, not for `#[tokio::main]`: the batching loop
# waits on "a receipt arrives" and "the deadline expires" at once. Without it
# the crate builds only when a dev-dependency happens to enable the feature —
# which it did, so `cargo check --workspace --all-targets` stayed green while
# `cargo check -p logging-export` did not.
tokio = { workspace = true, features = ["macros", "sync", "time"] }

# Milestone 010. `contacts.attributes` is the opaque JSON object spec §14.2
# prescribes, and the template engine of L-010-03 resolves `{{prenom}}` out of
# it. Reading it is therefore this crate's business: the alternative is having
# the IPC layer or `persistence` decode the document and hand a map down, which
# would put the "what is a usable attribute value" decision — blank is missing,
# a nested object is not a value — in a layer CLAUDE.md §3 says holds no
# business logic. Already compiled in this tree (`contacts`, `persistence`).
#
# NO `serde` derive: nothing here is serialised, and the document is read
# through `serde_json::Value` rather than into a type of ours, because its
# shape is whatever the import wrote.
serde_json.workspace = true

[features]
# The doubles of `src/testing.rs` — an in-memory journal, a scripted message
# centre, two recipient sources. Off by default, so nothing of it reaches the
# application binary; this crate's own integration and property tests enable it
# as a dev-dependency, the same arrangement `smpp-session` uses for its message
# centre.
test-support = []

[dev-dependencies]
# The crate's own integration tests drive the doubles, so they need the feature
# its own `[features]` gates. A self dev-dependency is the sanctioned way to say
# that.
messaging = { path = ".", features = ["test-support"] }

proptest.workspace = true
criterion.workspace = true

# The receipt pipeline is async and time-driven. `macros` for `#[tokio::test]`,
# `rt` for the harness it expands to, and `test-util` for `start_paused = true`
# — CLAUDE.md §7 asks for a deterministic clock, and a batching policy measured
# against the wall clock would assert on how fast the machine is.
tokio = { workspace = true, features = ["macros", "rt", "sync", "test-util", "time"] }

# NO dev-dependency on `smpp-session`, deliberately. The end-to-end tests of
# the send path need both crates, and putting them here would mean
# `messaging (dev) -> smpp-session -> messaging`. Cargo allows that cycle, but
# CLAUDE.md §3 says "no cycle" without distinguishing kinds. They live in
# `crates/smpp-session/tests/sending.rs` instead, which reaches both with no
# new edge — see that file's header.

# CA-004-10 asks for a `criterion` micro-benchmark as the milestone 017
# baseline. `harness = false` hands the target over to criterion instead of
# libtest.
[[bench]]
name = "segmentation"
harness = false

# CA-006-10 asks for the enqueue latency to stay under 1 ms at p99. The bench
# measures the CPU half of that path — validate, segment, build the PDUs — and
# says in its header what it deliberately leaves out.
[[bench]]
name = "enqueue"
harness = false

[lints]
workspace = true
