[package]
name = "smpp-session"
description = "SMPP session management, windowing and reconnection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true

# Layering boundaries from guide §4.2: dependencies always point
# downwards, never up. Any violation becomes a compile error.
smpp-core = { path = "../smpp-core" }
rate-control = { path = "../rate-control" }

# Session profiles are rows of `session_profiles` (spec §14.2). The domain
# type lives here — it is this crate that binds with it — and the mapping to
# and from the stored record lives next to it, in `profile`. The edge points
# downwards: `persistence` depends on `smpp-core` and on nothing else of ours,
# so there is no cycle.
persistence = { path = "../persistence" }

# The send port only. `messaging` declares `SmscSession`, this crate
# implements it for `SessionHandle` (ADR 0010) — the inversion of guide §8.1,
# whose cost is exactly this upward edge. `messaging` depends on `smpp-core`
# and on nothing else of ours, so the graph stays acyclic.
messaging = { path = "../messaging" }

# `net` for the TcpStream, `io-util` for the DuplexStream the tests run on,
# `time` for the back-off and the response timeouts, `sync` for the channels
# the actors talk over, `rt` + `macros` to spawn and select.
tokio = { workspace = true, features = [
  "rt",
  "net",
  "sync",
  "time",
  "io-util",
  "macros",
] }

# `codec` mounts `smpp_core::codec::CommandCodec` on the socket; `rt` brings
# `CancellationToken`, the single shutdown signal of CLAUDE.md §4.
tokio-util = { workspace = true, features = ["codec", "rt"] }

# `SinkExt` and `StreamExt`, which is how a `Framed` is written to and read
# from.
futures-util.workspace = true

tracing.workspace = true

# Jitter on the reconnection back-off — see the workspace manifest.
rand.workspace = true

[features]
# The in-memory message centre of `src/testing.rs`. Off by default, so nothing
# of it reaches the application binary; `smpp-session`'s own integration tests
# and `messaging`'s enable it as a dev-dependency.
test-support = ["tokio/io-util", "tokio/macros"]

[dev-dependencies]
# The crate's own integration tests drive the double, so they need the feature
# its own `[features]` gates. A self dev-dependency is the sanctioned way to
# say that.
smpp-session = { path = ".", features = ["test-support"] }

# `tests/pdu_log.rs` only. The library does not — and must not — depend on
# this crate: `PduObserver` is declared here precisely so that the recorder
# can sit above without this crate ever naming it (CLAUDE.md §3).
#
# The test does name it, and has to. What CA-008-09 asks about is the whole
# chain — socket, observer, bounded queue, recorder, store — and a test that
# stopped at a fake recorder would prove that a double behaves like a double.
# An integration test is its own crate, compiled after the library and unable
# to affect it, so this edge exists only under `cargo test`.
logging-export = { path = "../logging-export" }

tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "test-util",
  "io-util",
  "time",
  "sync",
] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
