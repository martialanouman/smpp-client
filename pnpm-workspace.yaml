# The frontend lives in `ui/`, but the root `package.json` is still required:
# it is the one carrying `@tauri-apps/cli` (`pnpm tauri dev` runs from the
# root, see CLAUDE.md §5) and husky, whose hooks path is relative to the git
# repository root. See docs/adr/0004-gestionnaire-de-paquets-frontend.md.
packages:
  - "ui"

minimumReleaseAgeExclude:
  - eslint@10.8.0

# pnpm ≥ 10 blocks dependency post-install scripts by default. Without this
# allow-list esbuild never writes its binary and `vite build` fails on a
# missing executable. Only add a package whose need has been verified — this
# is code execution at install time.
onlyBuiltDependencies:
  - esbuild
