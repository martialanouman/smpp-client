# Le guide §5.1 impose « rustfmt par défaut » : ce fichier ne change donc
# aucune règle de style. Il ne fixe que deux paramètres d'environnement, sans
# lesquels le formatage n'est pas reproductible.

# `cargo fmt` lit l'édition du manifeste, mais `rustfmt` invoqué directement —
# ce que fait rust-analyzer au format-à-la-sauvegarde — retombe sur l'édition
# 2015 et formate notamment `async`/`await` autrement. Sans cette ligne,
# l'éditeur défait à chaque sauvegarde ce que la CI exige.
edition = "2021"

# `cargo fmt --all --check` tourne aussi sur windows-latest. Combiné au
# `* text=auto eol=lf` de .gitattributes, ce réglage supprime toute une classe
# de faux diffs CRLF sur ce seul runner (CA-000-02).
newline_style = "Unix"

# NOTE — les options de tri et de regroupement des imports
# (`group_imports`, `imports_granularity`) sont réservées à rustfmt nightly.
# Sur stable, elles sont ignorées SANS ERREUR : les écrire ici donnerait
# l'illusion d'une règle appliquée. Elles supposent un job
# `cargo +nightly fmt` dédié — hors périmètre du jalon 000.
