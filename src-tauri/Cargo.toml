[package]
name = "shinobismpp"
description = "SMPP ESME client — Tauri IPC layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# REQUIRED since `gen_ipc` exists as a second binary: without it `cargo run`
# refuses to choose, and `tauri dev` — which shells out to `cargo run` — fails
# with "could not determine which binary to run". Nothing else catches this:
# `cargo build`, the tests and `just lint` all pass, because they build every
# binary rather than running one. Only starting the app does.
default-run = "shinobismpp"

[lib]
# The `_lib` suffix avoids a collision between the library name and the binary
# name on Windows (rust-lang/cargo#8519).
name = "shinobismpp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The IPC type generator. `scripts/check-ipc-types.sh` keys off the presence of
# `src/bin/gen_ipc.rs` to switch CI step 4 from "vacuously green" to "really
# checks" — the path is part of the contract, do not move it.
[[bin]]
name = "gen_ipc"
path = "src/bin/gen_ipc.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true

# `anyhow` is allowed HERE and nowhere else: this is the application boundary
# (CLAUDE.md §4). Business crates expose typed `thiserror` errors; only the
# entry point may aggregate them.
anyhow = "1"

# Structured logging (CLAUDE.md §4): `tracing` exclusively, with a rolling
# file appender in the OS log directory plus a console layer in development.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Only the `sync` feature: `tokio::sync::RwLock` guards the in-memory
# configuration. The runtime itself is Tauri's (`tauri::async_runtime`), we do
# not start a second one.
tokio = { version = "1", features = ["sync"] }

# IPC type generation — ADR 0003. Still `2.0.0-rc`, which the ADR records as
# accepted debt: the output is ordinary TypeScript, committed to the repo, so
# a disappearance upstream would not block the build.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# NOTE — no business crate is wired in yet: milestone 001 only carries the
# application shell and the IPC contract. Dependencies on `messaging`,
# `contacts`, `numbers-gen` and `logging-export` appear with their commands.

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }

[lints]
workspace = true
