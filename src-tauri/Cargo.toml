[package]
name = "shinobismpp"
description = "Client ESME SMPP — couche IPC Tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Le suffixe `_lib` évite une collision entre le nom de la bibliothèque et
# celui du binaire sur Windows (rust-lang/cargo#8519).
name = "shinobismpp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `anyhow` est autorisé ICI et nulle part ailleurs : c'est la bordure de
# l'application (CLAUDE.md §4). Les crates métier exposent des erreurs
# `thiserror` typées ; seul le point d'entrée a le droit de les agréger.
anyhow = "1"

# NOTE — aucune crate métier n'est encore branchée : `src-tauri` ne contient
# aucune logique et n'a donc rien à appeler. Les dépendances vers `messaging`,
# `contacts`, `numbers-gen` et `logging-export` apparaîtront au jalon 001,
# avec le contrat IPC.

[lints]
workspace = true
