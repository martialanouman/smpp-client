[package]
name = "shinobismpp"
description = "SMPP ESME client — Tauri IPC layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a collision between the library name and the binary
# name on Windows (rust-lang/cargo#8519).
name = "shinobismpp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `anyhow` is allowed HERE and nowhere else: this is the application boundary
# (CLAUDE.md §4). Business crates expose typed `thiserror` errors; only the
# entry point may aggregate them.
anyhow = "1"

# NOTE — no business crate is wired in yet: `src-tauri` holds no logic and so
# has nothing to call. Dependencies on `messaging`, `contacts`, `numbers-gen`
# and `logging-export` appear at milestone 001, along with the IPC contract.

[lints]
workspace = true
