[workspace]
resolver = "2"

# `src-tauri` belongs to the SAME workspace as the business crates, rather
# than being a standalone one as `create-tauri-app` generates: CA-000-01
# requires `cargo metadata --no-deps` to list them together. Practical
# consequence: a single `target/`, a single `Cargo.lock`, a single CI cache
# entry.
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Spec §6.3 states "Rust >= 1.78". That floor was never true: the Tauri
# dependency graph already required more at milestone 000, and nothing checked
# it. See docs/adr/0006-version-minimale-de-rust.md.
#
# THIS VALUE IS FOUND BY COMPILING, NOT BY READING MANIFESTS. The maximum
# `rust-version` declared across the graph gives 1.88 — and 1.88 does not
# build: `specta` uses `debug_closure_helpers`, stable only since 1.93, while
# declaring far less. A crate that under-declares its own MSRV is invisible to
# any manifest-based calculation.
#
# So the declared maximum is a FLOOR to start bisecting from, never the answer.
# The `msrv` CI job is the only source of truth: it pins a toolchain at this
# exact version and builds.
#
# After a dependency change, bisect from the floor:
#   cargo metadata --format-version 1 \
#     | jq -r '.packages[] | select(.rust_version) | .rust_version' \
#     | sort -V | tail -1                      # the floor
#   cargo +<version> check --workspace --all-targets   # the truth
rust-version = "1.93"
authors = ["Martial Anouman"]
repository = "https://github.com/martialanouman/smpp-client"
publish = false

[workspace.dependencies]
thiserror = "2.0.19"

# --- SMPP protocol core (milestone 003, ADR 0001) ---------------------------
#
# `default-features = false` then an explicit opt-in, feature by feature:
#
#   · `tokio-codec` — provides `CommandCodec`, the length-prefixed framing
#     rusmpp implements itself. `smpp-core` uses it purely in memory
#     (`BytesMut` in, `BytesMut` out); mounting it on a socket is milestone
#     005's job.
#   · `verbose` — decoding errors carry the chain of protocol FIELDS that
#     failed (`SmppField::SourceAddr`…), never their values. Turns "Decode
#     error" into something actionable.
#
# DELIBERATELY OMITTED — `tracing`. It reads like the right choice given
# CLAUDE.md §4 ("tracing exclusively"), and it is the wrong one: rusmpp logs
# the whole decoded command plus its hex bytes at debug level, which puts the
# `bind_transmitter` password in the log the moment a session opens. CLAUDE.md
# §8 forbids that, and the PDU hex dump is reserved for explicit debug mode.
# Without the feature rusmpp's logging macros expand to nothing.
rusmpp = { version = "0.4.0", default-features = false, features = [
  "tokio-codec",
  "verbose",
] }

# Buffer type of the rusmpp encode/decode API, and the `Encoder`/`Decoder`
# traits `CommandCodec` implements. Both are pure in-memory: no crate under
# `crates/` opens a socket.
bytes = { version = "1.10", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["codec"] }

# `client_message_id` and `session_id` are UUIDs (spec §14.2).
uuid = { version = "1.18", default-features = false, features = ["std", "v4"] }

proptest = "1.8"

# CA-004-10 wants a reference micro-benchmark for the encoding/segmentation
# hot path, to compare against at milestone 017. `default-features = false`
# drops `plotters` and the HTML report: the numbers are read from stdout and
# from `target/criterion`, and the graph rendering would pull a dozen crates
# whose licences would have to be reviewed for nothing.
criterion = { version = "0.7", default-features = false, features = [
  "cargo_bench_support",
] }

# --- Persistence (milestone 002, ADR 0002) ----------------------------------
#
# `default-features = false` then an explicit opt-in, because the default set
# drags in `any` (the runtime-erased driver) and `json`, neither of which this
# workspace uses:
#
#   · `runtime-tokio` — the only runtime here (guide §7.1). Without it sqlx
#     compiles against no runtime at all and every `connect()` fails to build.
#   · `sqlite` — pulls `libsqlite3-sys` with the C library BUNDLED. Deliberate:
#     the three release targets then ship the exact same SQLite build, instead
#     of whatever the host happens to have. Costs a C compilation.
#   · `macros` — `sqlx::query!`/`query_as!`, the compile-time checking that
#     ADR 0002 makes the deciding argument for sqlx over rusqlite.
#   · `migrate` — versioned migrations, and the `sqlx::migrate!()` macro that
#     embeds `migrations/` into the binary so a shipped application needs no
#     files on the side.
#
# DELIBERATELY OMITTED — `chrono`/`time`/`uuid`. Those features map Rust date
# and UUID types onto native column types; spec §14.2 stores both as TEXT, so
# the mapping would be a second, divergent conversion path next to
# `persistence::time`.
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "sqlite",
  "macros",
  "migrate",
] }

tokio = { version = "1.48", default-features = false }

# `BoxStream` in the signature of `stream_messages` (guide §11.3).
# `futures-core` holds the trait and the alias alone; `futures-util` adds the
# combinators used to build the stream, and is already compiled in this tree
# (Tauri pulls it), so the split costs nothing.
futures-core = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

tracing = { version = "0.1", default-features = false, features = ["std"] }

# Timestamps are stored as ISO-8601 UTC text (spec §14.2). `time` gives the
# RFC 3339 formatter and parser; it is already in the tree through Tauri, and
# `chrono` — also present — was not chosen because its API surface is far
# wider than the single format this workspace needs.
time = { version = "0.3", default-features = false, features = [
  "std",
  "formatting",
  "parsing",
] }

# Test-only.
tempfile = "3.24"
sha2 = "0.10"

# CA-002-05 asks for a test proving the memory a traversal holds stays
# bounded. Measuring that needs a counting global allocator, and writing one
# means `unsafe impl GlobalAlloc` — which `unsafe_code = "forbid"` rules out,
# with no local escape hatch. `stats_alloc` holds that `unsafe` inside its own
# crate, so the test only declares a `static`. Test-only, MIT, ~300 lines.
stats_alloc = "0.1"

# ---------------------------------------------------------------------------
# Machine-enforced coding rules
# ---------------------------------------------------------------------------
#
# This block is the heart of milestone 000. The "non-negotiable" rules of
# CLAUDE.md §4 and guide §5.4 stop being conventions that get discovered
# violated three milestones later: they become compile errors from the very
# first line written.
#
# Each crate opts in with `[lints] workspace = true`.
# Fine-grained configuration (test relaxations, deny lists) lives in
# `clippy.toml`, which *configures* lints without selecting them.

[workspace.lints.rust]
# `forbid`, not `deny`: a local `#[allow(unsafe_code)]` cannot lift it. The
# only escape hatch goes through this file, which CODEOWNERS covers — turning
# the "reviewed by a maintainer" of CLAUDE.md §4 from intent into mechanism.
unsafe_code = "forbid"

# Combined with `-D warnings` in CI, this makes the `///` on every public item
# required by CLAUDE.md §4 and guide §5.5 mandatory.
missing_docs = "warn"

# "Minimal visibility" (CLAUDE.md §4): flags a `pub` item only reachable
# within the crate, which should be `pub(crate)`.
unreachable_pub = "warn"

[workspace.lints.clippy]
# `priority = -1` lets the individually named lints below override the group.
all = { level = "deny", priority = -1 }

# Prohibitions from CLAUDE.md §4. `clippy.toml` reopens them inside tests,
# where they are explicitly allowed — otherwise every `mod tests` would need
# a cluster of `#[allow]` attributes.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

# "`tracing` exclusively, never `println!`/`eprintln!`" (CLAUDE.md §4).
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# Backing for the deny lists in `clippy.toml` (blocking I/O in async code,
# `std::sync::Mutex`). Enabled by name so they do not depend on group
# membership.
disallowed_methods = "deny"
disallowed_types = "deny"

# Numeric conversions: the SMPP codec constantly handles `u8`/`u16`/`u32`
# fields whose width the protocol fixes. A silent truncation there produces a
# malformed PDU that no high-level test catches. These four lints belong to
# `clippy::pedantic`, whose remainder is deliberately NOT enabled: under
# `-D warnings`, the full group would turn every public function into a
# negotiation.
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "warn"
